[data]
name = qsoxlyb
tracer1 = LYA
tracer2 = QSO
tracer1-type = continuous
tracer2-type = discrete
filename = /work/zhuxing/ebossdata/lya_forest/xcf_LYA_in_LYB_z_0_10-exp.fits.gz
test = True

[cuts]
rp-min = -200.
rp-max = +200.
rt-min = 0.
rt-max = 200.
r-min = 10.
r-max = 180.
mu-min = -1.
mu-max = +1.

[model]
model-hcd = Rogers2018
z evol LYA = bias_vs_z_std
z evol QSO = bias_vs_z_std
ell-max = 6
velocity dispersion = lorentz
radiation effects = True
old_fftlog=True
old_growth_func=True

# Whether to use the reionization module
reionization = yukawa

[metals]
filename = /work/zhuxing/ebossdata/lya_forest/metal_xdmat_LYA_in_LYB_z_0_10.fits
z evol = bias_vs_z_std
velocity dispersion = lorentz
old_growth_func=True
in tracer1 = SiII(1260) SiIII(1207) SiII(1193) SiII(1190) # CIV(eff) 

[parameters]
par binsize qsoxlyb = 4.
per binsize qsoxlyb = 4.
